name: Build Notebook App APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set App Name and Package ID
        run: |
          jq '.expo.name = "یادښتونه" | .expo.slug = "my-notebook" | .expo.android.package = "com.elyas.notebook"' app.json > temp.json && mv temp.json app.json
          echo "✅ Notebook App Name and Package ID set successfully!"

      - name: Inject Android Permissions
        run: |
          jq '.expo.android.permissions = [
            "android.permission.READ_EXTERNAL_STORAGE",
            "android.permission.WRITE_EXTERNAL_STORAGE",
            "android.permission.VIBRATE"
          ]' app.json > temp.json && mv temp.json app.json
          echo "✅ Permissions injected!"

      # دا هغه برخه ده چې بدله شوې او د سپلېش سکرین د رنګ ارور سل په سلو کې حلوي
      - name: Fix Assets and Splash Screen Error
        run: |
          mkdir -p assets
          
          # که تاسو icon.png نه وي اپلوډ کړی، دا به پخپله یو خالي کوچنی انځور جوړ کړي
          if [ ! -f "icon.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 --decode > icon.png
          fi
          
          # انځورونه د assets فولډر ته کاپي کوي
          cp icon.png assets/icon.png
          cp icon.png assets/adaptive-icon.png
          cp icon.png assets/splash.png
          
          # په app.json کې د انځورونو لارې او د شالید رنګ (سپین) ور اضافه کوي ترڅو انډرایډ ارور ورنکړي
          jq '.expo.icon = "./assets/icon.png" | .expo.splash = {"image": "./assets/splash.png", "resizeMode": "contain", "backgroundColor": "#ffffff"} | .expo.android.adaptiveIcon = {"foregroundImage": "./assets/adaptive-icon.png", "backgroundColor": "#ffffff"}' app.json > temp.json && mv temp.json app.json
          
          echo "✅ Assets and Splash Screen fixed successfully!"

      - name: Generate Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notebook-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
