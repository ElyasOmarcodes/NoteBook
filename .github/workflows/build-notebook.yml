name: Build Notebook App APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install dependencies
        run: npm install

      # ۱. د آزمایښتي اپلیکیشن نوم او پکیج تنظیمول
      - name: Set App Name and Package ID
        run: |
          jq '.expo.name = "یادښتونه" | .expo.slug = "my-notebook" | .expo.android.package = "com.elyas.notebook"' app.json > temp.json && mv temp.json app.json
          echo "✅ Notebook App Name and Package ID set successfully!"

      # ۲. د اړینو اجازو (Permissions) ورزیاتول (لکه سټوریج چې د نوټونو خوندي کولو لپاره پکار دی)
      - name: Inject Android Permissions
        run: |
          jq '.expo.android.permissions = [
            "android.permission.READ_EXTERNAL_STORAGE",
            "android.permission.WRITE_EXTERNAL_STORAGE",
            "android.permission.VIBRATE"
          ]' app.json > temp.json && mv temp.json app.json
          echo "✅ Permissions injected!"

      # ۳. د Expo Prebuild کمانډ رن کول
      - name: Generate Native Android Code
        run: npx expo prebuild --platform android --clean

      # ۴. د APK جوړول
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ۵. د جوړ شوي APK اپلوډ کول (ترڅو یې ډاونلوډ کړئ)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notebook-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
