name: Build Notebook App APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set App Name and Package ID
        run: |
          jq '.expo.name = "یادښتونه" | .expo.slug = "my-notebook" | .expo.android.package = "com.elyas.notebook"' app.json > temp.json && mv temp.json app.json
          echo "✅ Notebook App Name and Package ID set successfully!"

      - name: Inject Android Permissions
        run: |
          jq '.expo.android.permissions = [
            "android.permission.READ_EXTERNAL_STORAGE",
            "android.permission.WRITE_EXTERNAL_STORAGE",
            "android.permission.VIBRATE"
          ]' app.json > temp.json && mv temp.json app.json
          echo "✅ Permissions injected!"

      # دا نوی سټیپ دی چې د آیکون او فولډر ستونزه حل کوي!
      - name: Fix Assets and Icons Error
        run: |
          mkdir -p assets
          # که ستاسو په پروژه کې icon.png وي، هغه د لوګو په توګه کاروي
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            cp icon.png assets/adaptive-icon.png
            cp icon.png assets/splash.png
          else
            # که انځور نه وي، نو له app.json څخه د انځور اړتیا پاکوي ترڅو ارور ورنکړي
            jq 'del(.expo.icon, .expo.splash, .expo.android.adaptiveIcon)' app.json > temp.json && mv temp.json app.json
          fi
          echo "✅ Assets and Icons fixed successfully!"

      - name: Generate Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notebook-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
