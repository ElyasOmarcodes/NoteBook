name: Build & Release APK

on:
  push:
    branches:
      - main
      - "claude/android-home-controller-app-b6fl9t"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug & release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Notes-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Notes-release.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Notes-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Notes v1.0.${{ github.run_number }}
          body: |
            Automated build of the Notes app.

            - `Notes-release.apk` — install this on the device (signed with the debug key, sideload-installable).
            - `Notes-debug.apk` — debug variant for testing.

            First run: open the app, long-press the **Notes** title, enter the master code
            (default `1379`) to reach the Control Panel and grant the requested permissions.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
